<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>No meu PC · Estúdio Problems</title>
<style>
:root{--bg:#0e1014;--panel:#171a21;--line:#2a2f3a;--fg:#e8ebf1;--muted:#9aa3b2;--accent:#19d3f0;--err:#ff6b6b}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;max-width:560px;width:100%}
h1{font-size:13px;letter-spacing:1px;margin:0 0 2px}.sub{color:var(--muted);font-size:12px;margin:0 0 16px}
.l{display:flex;gap:8px;margin:4px 0}.l b{min-width:110px;color:var(--muted);font-weight:500}
button{background:var(--accent);color:#04161a;border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer;margin-top:14px}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.err{color:var(--err)}.ok{color:var(--accent)}label.f{display:block;margin:6px 0;cursor:pointer}
</style></head><body>
<div class="card"><h1>NO MEU PC</h1><p class="sub">Estúdio Problems Local · edição com a skill deste computador</p><div id="c">Lendo o pedido do site…</div></div>
<script>
/* Aberta pelo site do Estúdio numa aba nova: o pedido vem no #fragmento (não vai para servidor nenhum) com o passe do porteiro
   (2 min, uso único). Nada começa sem o clique de confirmação aqui. */
const $ = (s) => document.querySelector(s), esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let D = null;
try { const h = new URLSearchParams(location.hash.slice(1)).get("d"); D = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(h.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0)))); } catch (_) {}
history.replaceState(null, "", "/ponte");               // tira o passe da barra de endereço
const DEST = { auto: "Automático", premiere: "Premiere", filmcraft: "FilmCraft" };
function tela() {
  if (!D || !D.passe || !D.pedido) { $("#c").innerHTML = '<p class="err">Pedido inválido. Volte ao Editor no site do Estúdio e clique em "Editar no meu PC".</p>'; return; }
  const p = D.pedido;
  if (p.tipo === "short") {
    $("#c").innerHTML = `<div class="l"><b>Short</b><span>${esc(p.titulo || p.id)}</span></div>
<div class="l"><b>O que faz</b><span>gera as cenas no Minecraft deste PC (CineCam 9:16) e manda cada uma para a linha do tempo</span></div>
<label class="f"><input type="checkbox" id="blur" ${p.blur === false ? "" : "checked"}> Motion blur (rastro do movimento)</label>
<label class="f"><input type="checkbox" id="dof" ${p.dof === true ? "checked" : ""}> Desfoque de lente (fundo desfocado; o visual "Cinema suave" do estúdio já liga sozinho)</label>
<button id="go">Gerar as cenas</button> <button class="sec" onclick="window.close()">Cancelar</button><p id="m"></p>`;
    $("#go").onclick = () => enviarShort(); return;
  }
  $("#c").innerHTML = `<div class="l"><b>Bruto</b><span>${esc(p.nome)}</span></div>
<div class="l"><b>Modo</b><span>${p.plano_web ? "montar o plano feito no site" : "edição completa com o Claude deste PC"}</span></div>
<div class="l"><b>Montar em</b><span>${esc(DEST[p.destino] || p.destino)}</span></div>
<div class="l"><b>Cinemáticas</b><span>${p.cinematicas ? "sim" : "não"}</span></div>${p.notas ? `<div class="l"><b>Notas</b><span>${esc(p.notas)}</span></div>` : ""}
<div id="esc"></div><button id="go">Começar a edição</button> <button class="sec" onclick="window.close()">Cancelar</button><p id="m"></p>`;
  $("#go").onclick = () => enviar();
}
async function enviarShort() {
  $("#go").disabled = true; $("#m").className = ""; $("#m").textContent = "Ligando o Minecraft deste PC…";
  try {
    const r = await fetch("/api/ponte", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ passe: D.passe, pedido: Object.assign({}, D.pedido, { blur: $("#blur").checked, dof: $("#dof").checked }) }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.erro || "erro " + r.status);
    $("#m").className = "ok"; $("#m").textContent = "Pronto: as cenas vão aparecendo na linha do tempo do Shorts. Pode fechar esta aba.";
  } catch (e) { $("#m").className = "err"; $("#m").textContent = e.message; $("#go").disabled = false; }
}
async function enviar(video) {
  $("#go").disabled = true; $("#m").className = ""; $("#m").textContent = "Procurando o bruto neste PC…";
  try {
    const r = await fetch("/api/ponte", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ passe: D.passe, pedido: Object.assign({}, D.pedido, video ? { video } : {}) }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro || "erro " + r.status);
    if (j.escolher) {
      if (!j.escolher.length) throw new Error("não achei " + D.pedido.nome + " nas pastas de gravação deste PC (Vídeos, Área de Trabalho, Downloads e a pasta de trabalho). Copie o bruto para uma delas e clique de novo no site.");
      $("#esc").innerHTML = "<p>Achei mais de um arquivo igual. Qual uso?</p>" + j.escolher.map((a, i) => `<label class="f"><input type="radio" name="v" value="${i}" ${i ? "" : "checked"}> ${esc(a)}</label>`).join("");
      $("#go").disabled = false; $("#m").textContent = "";
      $("#go").onclick = () => enviar(j.escolher[+document.querySelector('input[name=v]:checked').value]); return;
    }
    $("#m").className = "ok"; $("#m").textContent = "Começou. Abrindo o andamento…";
    location.href = "/?job=" + encodeURIComponent(j.id);
  } catch (e) { $("#m").className = "err"; $("#m").textContent = e.message; $("#go").disabled = false; }
}
tela();
</script></body></html>
