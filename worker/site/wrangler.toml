# Editor Problems (vídeo longo): o Worker serve a pasta site/ só para quem entrou pelo menu (passe do porteiro).
# Publicado pela Action "Publicar o editor com senha (Cloudflare)".
name = "editor-problems"
main = "worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["global_fetch_strictly_public"]  # buscar a chave do porteiro pela internet pública
workers_dev = true

[assets]
directory = "../../site"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[vars]
# porteiro do endereço único: só quem chega por ele com passe assinado entra (ver worker.js)
PORTEIRO_URL = "https://estudio.problemsraiz.workers.dev"
PORTEIRO_CAMINHO = "/editor/"   # onde o editor fica no endereço único

# ligação direta com o porteiro (mesma conta da Cloudflare "problemsraiz"): buscar a chave pública do passe
[[services]]
binding = "PORTEIRO"
service = "estudio"
