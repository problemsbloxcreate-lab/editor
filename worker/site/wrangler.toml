# Editor Problems (vídeo longo) com senha: o Worker serve a pasta site/ e pede a senha antes (segredo SENHA_SITE).
# Publicado pela Action "Publicar o editor com senha (Cloudflare)".
name = "editor-problems"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "../../site"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"
